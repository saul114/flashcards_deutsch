<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <title>Alemany A1 - Vocabulari (OLED)</title>
    <style>
        :root {
            /* MODO OLED OSCUR */
            --bg-gradient: #000000;
            --card-bg: #121212;
            --text-main: #f8fafc;
            --text-muted: #a1a1aa;
            --primary: #3b82f6;
            --primary-hover: #60a5fa;
            --der-color: #38bdf8;
            --die-color: #fb7185;
            --das-color: #34d399;
            --safe-top: env(safe-area-inset-top, 20px);
            --safe-bottom: env(safe-area-inset-bottom, 20px);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding-top: var(--safe-top);
            padding-bottom: var(--safe-bottom);
        }

        header {
            padding: 16px 20px;
            text-align: center;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255,255,255,0.08);
            z-index: 10;
        }
        h1 {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 14px;
            letter-spacing: -0.3px;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        select, button {
            padding: 12px 18px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.15);
            font-size: 0.95rem;
            font-weight: 500;
            background: #1c1c1e;
            color: var(--text-main);
            outline: none;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
            transition: all 0.2s ease;
        }
        select {
            appearance: none;
            padding-right: 36px;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23f8fafc%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.4-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 14px top 50%;
            background-size: 10px auto;
        }
        select:active { background-color: #2c2c2e; }
        button {
            background: var(--primary);
            color: white;
            font-weight: 600;
            border: none;
        }
        button:active {
            background: var(--primary-hover);
            transform: scale(0.96);
        }
        
        .progress-container {
            width: 100%;
            height: 5px;
            background: rgba(255,255,255,0.12);
            margin-top: 18px;
            border-radius: 3px;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card-container {
            flex: 1;
            perspective: 1500px;
            padding: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }
        .card {
            width: 100%;
            height: 100%;
            max-height: 520px;
            position: relative;
            transition: transform 0.65s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-style: preserve-3d;
            cursor: pointer;
        }
        .card.is-flipped {
            transform: rotateY(180deg);
        }
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            background: var(--card-bg);
            border-radius: 32px;
            box-shadow: 0 12px 36px rgba(0,0,0,0.7), 0 4px 12px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 32px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .card-back {
            transform: rotateY(180deg);
            background: #0a0a0a;
        }

        .type-badge {
            position: absolute;
            top: 24px;
            right: 24px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            background: rgba(255,255,255,0.1);
            padding: 6px 12px;
            border-radius: 12px;
            color: var(--text-muted);
        }
        
        .speak-btn {
            position: absolute;
            top: 18px;
            left: 20px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.2);
            color: var(--text-main);
            width: 54px;
            height: 54px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            z-index: 10;
            transition: all 0.2s;
        }
        .speak-btn:active {
            transform: scale(0.85);
            background: rgba(255,255,255,0.2);
        }

        .word-main {
            font-size: 2.6rem;
            font-weight: 800;
            margin-bottom: 8px;
            line-height: 1.15;
            word-break: break-word;
            letter-spacing: -0.5px;
        }
        .word-secondary {
            font-size: 1.5rem;
            color: var(--text-muted);
            margin-bottom: 12px;
            font-weight: 500;
        }
        .plural-text {
            font-size: 1.15rem;
            color: var(--text-muted);
            font-style: italic;
            margin-bottom: 24px;
            background: rgba(255,255,255,0.05);
            padding: 8px 18px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        
        .example-box {
            background: rgba(255,255,255,0.04);
            padding: 20px;
            border-radius: 18px;
            width: 100%;
            font-size: 1.05rem;
            line-height: 1.5;
            text-align: left;
            border-left: 4px solid var(--primary);
            margin-top: 10px;
        }
        .example-de {
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 6px;
        }
        .example-ca {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .art-der { color: var(--der-color); }
        .art-die { color: var(--die-color); }
        .art-das { color: var(--das-color); }
        .hidden-art { color: #52525b; } 
        
        .footer-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 32px 25px;
        }
        .nav-btn {
            background: #1c1c1e;
            color: var(--text-main);
            width: 64px;
            height: 64px;
            border-radius: 50%;
            font-size: 1.6rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 14px rgba(0,0,0,0.4);
            transition: all 0.2s ease;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .nav-btn:active {
            background: #2c2c2e;
            transform: scale(0.92);
        }
        
        .stats-counter {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
            background: rgba(0, 0, 0, 0.8);
            padding: 8px 16px;
            border-radius: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1);
        }
    </style>
    <script src="vocab.js"></script>
</head>
<body>

    <header>
        <h1>Alemany A1 - Netzwerk neu</h1>
        <div class="controls">
            <select id="modeSelect">
                <option value="de-ca">DE ➔ CA (Reconeixement)</option>
                <option value="ca-de">CA ➔ DE (Producció)</option>
                <option value="art-pl">Art. + Plural (Només Noms)</option>
            </select>
            <button id="shuffleBtn">🔀 Remenar</button>
        </div>
        <div class="progress-container">
            <div class="progress-bar" id="progressFill"></div>
        </div>
    </header>

    <div class="card-container" id="cardContainer">
        <div class="card" id="flashcard">
            <div class="card-face card-front" id="cardFront"></div>
            <div class="card-face card-back" id="cardBack"></div>
        </div>
    </div>

    <div class="footer-controls">
        <button class="nav-btn" id="prevBtn">←</button>
        <div class="stats-counter" id="statsDisplay">0 / 0</div>
        <button class="nav-btn" id="nextBtn">→</button>
    </div>

    <script>
        const FALLBACK_VOCAB = [
            { id: "fb_1", type: "noun", article: "der", word: "Apfel", pluralSuffix: "¨-", pluralFull: "die Äpfel", forms: "der Apfel, ¨-", ca: "poma", exDe: "Ich esse einen Apfel.", exCa: "Menjo una poma." },
            { id: "fb_2", type: "noun", article: "das", word: "Buch", pluralSuffix: "¨-er", pluralFull: "die Bücher", forms: "das Buch, ¨-er", ca: "llibre", exDe: "Das Buch ist interessant.", exCa: "El llibre és interessant." },
            { id: "fb_3", type: "noun", article: "die", word: "Frau", pluralSuffix: "-en", pluralFull: "die Frauen", forms: "die Frau, -en", ca: "dona", exDe: "Die Frau heißt Anna.", exCa: "La dona es diu Anna." },
            { id: "fb_4", type: "verb", article: "", word: "gehen", pluralSuffix: "", pluralFull: "", forms: "gehen (verb)", ca: "anar", exDe: "Ich gehe nach Hause.", exCa: "Vaig cap a casa." }
        ];

        let vocab = [];
        let currentIndex = 0;
        let isFlipped = false;
        let currentMode = 'de-ca';

        const card = document.getElementById('flashcard');
        const cardFront = document.getElementById('cardFront');
        const cardBack = document.getElementById('cardBack');
        const modeSelect = document.getElementById('modeSelect');
        const statsDisplay = document.getElementById('statsDisplay');
        const progressFill = document.getElementById('progressFill');

        window.playSpeech = function(text, event) {
            event.stopPropagation();
            if (!('speechSynthesis' in window)) {
                alert("El teu navegador no suporta la reproducció d'àudio.");
                return;
            }
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'de-DE';
            utterance.rate = 0.85; 
            window.speechSynthesis.speak(utterance);
        };

        function getSpeakerButton(item, hideArticle = false) {
            let speakText = item.word;
            if (item.type === 'noun' && item.article && !hideArticle) {
                speakText = item.article + ' ' + item.word;
            }
            const icon = `<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>`;
            return `<button class="speak-btn" onclick="playSpeech('${speakText.replace(/'/g, "\'")}', event)">${icon}</button>`;
        }

        function initApp() {
            if (typeof window.VOCAB_DATA !== 'undefined' && Array.isArray(window.VOCAB_DATA) && window.VOCAB_DATA.length > 0) {
                vocab = [...window.VOCAB_DATA];
            } else {
                vocab = [...FALLBACK_VOCAB];
            }
            vocab = vocab.map(item => {
                if(item.ca) item.ca = item.ca.replace(/^\d+[\.\-\)]?\s*/, '').trim();
                return item;
            });
            applyModeFilter();
        }

        function applyModeFilter() {
            currentMode = modeSelect.value;
            let currentList = (typeof window.VOCAB_DATA !== 'undefined') ? [...window.VOCAB_DATA] : [...FALLBACK_VOCAB];
            if (currentMode === 'art-pl') vocab = currentList.filter(item => item.type === 'noun');
            else vocab = currentList;
            currentIndex = 0;
            updateCard();
        }

        function getArticleHTML(article, showHidden = false) {
            if (!article) return '';
            const cssClass = `art-${article}`;
            if (showHidden) return `<span class="${cssClass} hidden-art">???</span>`;
            return `<span class="${cssClass}">${article}</span>`;
        }

        function updateCard() {
            if (vocab.length === 0) return;

            const item = vocab[currentIndex];
            statsDisplay.innerText = `${currentIndex + 1} / ${vocab.length}`;
            progressFill.style.width = `${((currentIndex + 1) / vocab.length) * 100}%`;
            
            let frontHTML = '';
            let backHTML = '';
            
            let typeLabel = item.type === 'noun' ? 'Substantiu' : (item.type === 'verb' ? 'Verb' : 'Altres');
            let typeBadge = `<div class="type-badge">${typeLabel}</div>`;
            let speakerFront = getSpeakerButton(item);
            let speakerBack = getSpeakerButton(item);

            if (currentMode === 'de-ca') {
                if (item.type === 'noun') {
                    let suffix = item.pluralSuffix && item.pluralSuffix !== '-' ? `, ${item.pluralSuffix}` : (item.pluralSuffix === '-' ? ', -' : '');
                    frontHTML = `${speakerFront}${typeBadge}<div class="word-main">${getArticleHTML(item.article)} ${item.word}${suffix}</div>`;
                } else {
                    frontHTML = `${speakerFront}${typeBadge}<div class="word-main">${item.word}</div>`;
                }

                backHTML = `<div class="word-main">${item.ca}</div>`;
                if (item.type === 'noun' && item.pluralFull) backHTML += `<div class="plural-text">Plural: ${item.pluralFull}</div>`;
                if (item.exDe) backHTML += `<div class="example-box"><div class="example-de">${item.exDe}</div><div class="example-ca">${item.exCa}</div></div>`;
            } 
            else if (currentMode === 'ca-de') {
                frontHTML = `${typeBadge}<div class="word-main">${item.ca}</div>`;
                
                backHTML = `${speakerBack}<div class="word-main">${getArticleHTML(item.article)} ${item.word}</div>`;
                if (item.type === 'noun' && item.pluralFull) backHTML += `<div class="plural-text">Plural: ${item.pluralFull}</div>`;
                if (item.exDe) backHTML += `<div class="example-box"><div class="example-de">${item.exDe}</div><div class="example-ca">${item.exCa}</div></div>`;
            }
            else if (currentMode === 'art-pl') {
                // Sense botó d'àudio a la cara frontal perquè no doni pistes
                frontHTML = `${typeBadge}
                             <div class="word-main">${getArticleHTML(item.article, true)} ${item.word}</div>
                             <div class="plural-text">Plural: ???</div>
                             <div class="word-secondary">${item.ca}</div>`;
                
                // Botó d'àudio només a la part posterior, on es mostra la solució
                backHTML = `${speakerBack}
                            <div class="word-main">${getArticleHTML(item.article)} ${item.word}</div>
                            <div class="plural-text">Plural: ${item.pluralFull}</div>`;
            }

            card.classList.remove('is-flipped');
            isFlipped = false;
            
            setTimeout(() => {
                cardFront.innerHTML = frontHTML;
                cardBack.innerHTML = backHTML;
            }, 180); 
        }

        card.addEventListener('click', () => {
            isFlipped = !isFlipped;
            card.classList.toggle('is-flipped', isFlipped);
        });
        document.getElementById('prevBtn').addEventListener('click', () => {
            if (currentIndex > 0) currentIndex--;
            else currentIndex = vocab.length - 1;
            updateCard();
        });
        document.getElementById('nextBtn').addEventListener('click', () => {
            if (currentIndex < vocab.length - 1) currentIndex++;
            else currentIndex = 0;
            updateCard();
        });
        document.getElementById('shuffleBtn').addEventListener('click', () => {
            for (let i = vocab.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [vocab[i], vocab[j]] = [vocab[j], vocab[i]];
            }
            currentIndex = 0;
            updateCard();
        });
        modeSelect.addEventListener('change', applyModeFilter);

        let touchstartX = 0;
        let touchendX = 0;
        const SWIPE_THRESHOLD = 50; 
        document.getElementById('cardContainer').addEventListener('touchstart', e => {
            touchstartX = e.changedTouches[0].screenX;
        }, {passive: true});
        document.getElementById('cardContainer').addEventListener('touchend', e => {
            touchendX = e.changedTouches[0].screenX;
            if (touchendX < touchstartX - SWIPE_THRESHOLD) document.getElementById('nextBtn').click();
            if (touchendX > touchstartX + SWIPE_THRESHOLD) document.getElementById('prevBtn').click();
        }, {passive: true});

        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>

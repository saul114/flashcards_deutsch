  <style>
    :root {
      --bg: #0f1117;
      --card-bg: #1c1f2e;
      --card-back-bg: #252a3d;
      --text: #f0f3fa;
      --text-muted: #8e9bb0;
      --primary: #3b82f6;
      --der: #38bdf8;
      --die: #f472b6;
      --das: #4ade80;
      --success: #10b981;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    header {
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 700;
    }
    .badge {
      background: rgba(59, 130, 246, 0.2);
      color: var(--primary);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .progress-bar-container {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.06);
    }
    .progress-bar {
      height: 100%;
      background: var(--primary);
      width: 0%;
      transition: width 0.3s ease;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      perspective: 1000px;
    }
    .card-container {
      width: 100%;
      max-width: 380px;
      height: 420px;
      position: relative;
      cursor: pointer;
      transform-style: preserve-3d;
      transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .card-container.flipped {
      transform: rotateY(180deg);
    }
    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 24px;
      padding: 28px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .card-front {
      background: var(--card-bg);
    }
    .card-back {
      background: var(--card-back-bg);
      transform: rotateY(180deg);
    }
    .card-tag {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 600;
    }
    .tag-der { color: var(--der); }
    .tag-die { color: var(--die); }
    .tag-das { color: var(--das); }
    .tag-none { color: var(--text-muted); }
    .card-center {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    .term {
      font-size: 1.85rem;
      font-weight: 700;
      line-height: 1.25;
    }
    .defn {
      font-size: 1.4rem;
      color: #cbd5e1;
      font-weight: 500;
      line-height: 1.35;
    }
    .audio-btn {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: var(--text);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      cursor: pointer;
      margin-top: 8px;
    }
    .card-footer {
      display: flex;
      justify-content: space-between;
      color: var(--text-muted);
      font-size: 0.85rem;
    }
    .controls {
      padding: 16px 20px 24px;
      display: flex;
      gap: 12px;
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
    }
    .btn {
      flex: 1;
      padding: 14px;
      border-radius: 16px;
      border: none;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.1s ease;
    }
    .btn:active {
      transform: scale(0.97);
    }
    .btn-prev {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
    }
    .btn-learned {
      background: var(--success);
      color: #fff;
    }
    .btn-next {
      background: var(--primary);
      color: #fff;
    }
  </style>
</head>

28, "term": "tief", "definition": "profund", "gender": "none"}, {"id": 829, "term": "flach", "definition": "pla / poc profund", "gender": "none"}, {"id": 830, "term": "rund", "definition": "rodó", "gender": "none"}, {"id": 831, "term": "eckig", "definition": "quadrat / amb cantonades", "gender": "none"}];

    let currentIndex = 0;
    let learnedSet = new Set(JSON.parse(localStorage.getItem('de_a1_learned') || '[]'));

    const card = document.getElementById('card');
    const termText = document.getElementById('termText');
    const defnText = document.getElementById('defnText');
    const counter = document.getElementById('counter');
    const cardId = document.getElementById('cardId');
    const progress = document.getElementById('progress');
    const tagFront = document.getElementById('tagFront');
    const audioBtn = document.getElementById('audioBtn');
    const learnedStatus = document.getElementById('learnedStatus');

    function updateCard() {
      card.classList.remove('flipped');
      const item = VOCAB[currentIndex];
      termText.textContent = item.term;
      defnText.textContent = item.definition;
      counter.textContent = `${currentIndex + 1} / ${VOCAB.length}`;
      cardId.textContent = `#${item.id}`;
      progress.style.width = `${((currentIndex + 1) / VOCAB.length) * 100}%`;

      tagFront.className = `card-tag tag-${item.gender}`;
      tagFront.textContent = item.gender !== 'none' ? item.gender.toUpperCase() : 'VOCABULARI';

      const isLearned = learnedSet.has(item.id);
      learnedStatus.textContent = isLearned ? '✓ Apresa' : 'Pendent';
      learnedStatus.style.color = isLearned ? '#10b981' : '#8e9bb0';
    }

    card.addEventListener('click', (e) => {
      if (e.target.closest('#audioBtn')) return;
      card.classList.toggle('flipped');
    });

    audioBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const item = VOCAB[currentIndex];
      const cleanTerm = item.term.split(',')[0].replace(/\([^)]*\)/g, '').trim();
      const utter = new SpeechSynthesisUtterance(cleanTerm);
      utter.lang = 'de-DE';
      utter.rate = 0.85;
      window.speechSynthesis.speak(utter);
    });

    document.getElementById('nextBtn').addEventListener('click', () => {
      if (currentIndex < VOCAB.length - 1) {
        currentIndex++;
        updateCard();
      }
    });

    document.getElementById('prevBtn').addEventListener('click', () => {
      if (currentIndex > 0) {
        currentIndex--;
        updateCard();
      }
    });

    document.getElementById('learnedBtn').addEventListener('click', () => {
      const item = VOCAB[currentIndex];
      if (learnedSet.has(item.id)) {
        learnedSet.delete(item.id);
      } else {
        learnedSet.add(item.id);
      }
      localStorage.setItem('de_a1_learned', JSON.stringify(Array.from(learnedSet)));
      updateCard();
    });

    // Touch swipe support
    let startX = 0;
    document.addEventListener('touchstart', (e) => { startX = e.touches[0].clientX; }, { passive: true });
    document.addEventListener('touchend', (e) => {
      const diffX = e.changedTouches[0].clientX - startX;
      if (diffX > 60 && currentIndex > 0) {
        currentIndex--;
        updateCard();
      } else if (diffX < -60 && currentIndex < VOCAB.length - 1) {
        currentIndex++;
        updateCard();
      }
    }, { passive: true });

    updateCard();
  </script>

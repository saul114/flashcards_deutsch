<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <!-- Optimització iPhone: viewport-fit=cover i deshabilitar zoom per a comportament d'App nativa -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Alemany A1 - Vocabulari</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #f6f8fd 0%, #f1f5f9 100%);
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --der-color: #0ea5e9; /* Blau brillant */
            --die-color: #e11d48; /* Vermell/Rosa intens */
            --das-color: #10b981; /* Verd maragda */
            --safe-top: env(safe-area-inset-top, 20px);
            --safe-bottom: env(safe-area-inset-bottom, 20px);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding-top: var(--safe-top);
            padding-bottom: var(--safe-bottom);
        }

        /* --- HEADER & CONTROLS (Glassmorphism) --- */
        header {
            padding: 16px 20px;
            text-align: center;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(0,0,0,0.05);
            z-index: 10;
        }
        h1 {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 14px;
            letter-spacing: -0.3px;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        select, button {
            padding: 12px 18px;
            border-radius: 14px;
            border: 1px solid rgba(0,0,0,0.08);
            font-size: 0.95rem;
            font-weight: 500;
            background: white;
            color: var(--text-main);
            outline: none;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            transition: all 0.2s ease;
        }
        select {
            appearance: none;
            padding-right: 36px;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%231e293b%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.4-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 14px top 50%;
            background-size: 10px auto;
        }
        select:active { background-color: #f8fafc; }
        button {
            background: var(--primary);
            color: white;
            font-weight: 600;
            border: none;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }
        button:active {
            background: var(--primary-hover);
            transform: scale(0.96);
        }
        
        /* Barra de progrés */
        .progress-container {
            width: 100%;
            height: 5px;
            background: rgba(0,0,0,0.06);
            margin-top: 18px;
            border-radius: 3px;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* --- 3D CARD SCENE --- */
        .card-container {
            flex: 1;
            perspective: 1500px;
            padding: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }
        .card {
            width: 100%;
            height: 100%;
            max-height: 520px;
            position: relative;
            /* Animació súper suau estil iOS */
            transition: transform 0.65s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-style: preserve-3d;
            cursor: pointer;
        }
        .card.is-flipped {
            transform: rotateY(180deg);
        }
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            background: var(--card-bg);
            border-radius: 32px;
            box-shadow: 0 12px 36px rgba(0,0,0,0.08), 0 2px 8px rgba(0,0,0,0.03);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 32px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.6);
        }
        .card-back {
            transform: rotateY(180deg);
            background: #fafcff;
            border: 1px solid rgba(0,0,0,0.04);
        }

        /* --- TIPOGRAFIA INTERNA --- */
        .type-badge {
            position: absolute;
            top: 24px;
            right: 24px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            background: #f1f5f9;
            padding: 6px 12px;
            border-radius: 12px;
            color: var(--text-muted);
        }

        .word-main {
            font-size: 2.6rem;
            font-weight: 800;
            margin-bottom: 8px;
            line-height: 1.15;
            word-break: break-word;
            letter-spacing: -0.5px;
        }
        .word-secondary {
            font-size: 1.5rem;
            color: var(--text-muted);
            margin-bottom: 12px;
            font-weight: 500;
        }
        .plural-text {
            font-size: 1.15rem;
            color: var(--text-muted);
            font-style: italic;
            margin-bottom: 24px;
            background: #f8fafc;
            padding: 8px 18px;
            border-radius: 20px;
            border: 1px solid rgba(0,0,0,0.03);
        }
        
        .example-box {
            background: #f8fafc;
            padding: 20px;
            border-radius: 18px;
            width: 100%;
            font-size: 1.05rem;
            line-height: 1.5;
            text-align: left;
            border-left: 4px solid var(--primary);
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.02);
            margin-top: 10px;
        }
        .example-de {
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 6px;
        }
        .example-ca {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* Colors dels articles */
        .art-der { color: var(--der-color); }
        .art-die { color: var(--die-color); }
        .art-das { color: var(--das-color); }
        .hidden-art { color: #cbd5e1; } /* Per al mode ocult */
        
        /* --- NAVEGACIÓ INFERIOR --- */
        .footer-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 32px 25px;
        }
        .nav-btn {
            background: white;
            color: var(--text-main);
            width: 64px;
            height: 64px;
            border-radius: 50%;
            font-size: 1.6rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 14px rgba(0,0,0,0.06);
            transition: all 0.2s ease;
            border: 1px solid rgba(0,0,0,0.02);
        }
        .nav-btn:active {
            background: #f1f5f9;
            transform: scale(0.92);
        }
        
        .stats-counter {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
            background: rgba(255,255,255,0.6);
            padding: 8px 16px;
            border-radius: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }

    </style>
    <!-- Carreguem el fitxer extern (vocab.js). Si falla o està bloquejat, l'App ho detecta i utilitza un Fallback. -->
    <script src="vocab.js"></script>
</head>
<body>

    <header>
        <h1>Alemany A1 - Netzwerk neu</h1>
        <div class="controls">
            <select id="modeSelect">
                <option value="de-ca">DE ➔ CA (Reconeixement)</option>
                <option value="ca-de">CA ➔ DE (Producció)</option>
                <option value="art-pl">Art. + Plural (Només Noms)</option>
            </select>
            <button id="shuffleBtn">🔀 Remenar</button>
        </div>
        <div class="progress-container">
            <div class="progress-bar" id="progressFill"></div>
        </div>
    </header>

    <div class="card-container" id="cardContainer">
        <div class="card" id="flashcard">
            <div class="card-face card-front" id="cardFront">
                <!-- S'omple per JS -->
            </div>
            <div class="card-face card-back" id="cardBack">
                <!-- S'omple per JS -->
            </div>
        </div>
    </div>

    <div class="footer-controls">
        <button class="nav-btn" id="prevBtn">←</button>
        <div class="stats-counter" id="statsDisplay">0 / 0</div>
        <button class="nav-btn" id="nextBtn">→</button>
    </div>

    <script>
        // Dades d'emergència en cas de que iOS bloquegi el fitxer local
        const FALLBACK_VOCAB = [
            { id: "fb_1", type: "noun", article: "der", word: "Apfel", pluralSuffix: "¨-", pluralFull: "die Äpfel", forms: "der Apfel, ¨-", ca: "poma", exDe: "Ich esse einen Apfel.", exCa: "Menjo una poma." },
            { id: "fb_2", type: "noun", article: "das", word: "Buch", pluralSuffix: "¨-er", pluralFull: "die Bücher", forms: "das Buch, ¨-er", ca: "llibre", exDe: "Das Buch ist interessant.", exCa: "El llibre és interessant." },
            { id: "fb_3", type: "noun", article: "die", word: "Frau", pluralSuffix: "-en", pluralFull: "die Frauen", forms: "die Frau, -en", ca: "dona", exDe: "Die Frau heißt Anna.", exCa: "La dona es diu Anna." },
            { id: "fb_4", type: "verb", article: "", word: "gehen", pluralSuffix: "", pluralFull: "", forms: "gehen (verb)", ca: "anar", exDe: "Ich gehe nach Hause.", exCa: "Vaig cap a casa." }
        ];

        let vocab = [];
        let currentIndex = 0;
        let isFlipped = false;
        let currentMode = 'de-ca';

        const card = document.getElementById('flashcard');
        const cardFront = document.getElementById('cardFront');
        const cardBack = document.getElementById('cardBack');
        const modeSelect = document.getElementById('modeSelect');
        const statsDisplay = document.getElementById('statsDisplay');
        const progressFill = document.getElementById('progressFill');

        function initApp() {
            if (typeof window.VOCAB_DATA !== 'undefined' && Array.isArray(window.VOCAB_DATA) && window.VOCAB_DATA.length > 0) {
                vocab = [...window.VOCAB_DATA];
            } else {
                vocab = [...FALLBACK_VOCAB];
                console.warn("Fitxer vocab.js no trobat o bloquejat. Carregant dades de prova.");
            }
            
            // Neteja preventiva: treure números inicials del català per si n'hi hagués (ex: "1. Taula" -> "Taula")
            vocab = vocab.map(item => {
                if(item.ca) item.ca = item.ca.replace(/^\d+[\.\-\)]?\s*/, '').trim();
                return item;
            });

            applyModeFilter();
        }

        function applyModeFilter() {
            currentMode = modeSelect.value;
            let currentList = (typeof window.VOCAB_DATA !== 'undefined') ? [...window.VOCAB_DATA] : [...FALLBACK_VOCAB];
            
            if (currentMode === 'art-pl') {
                vocab = currentList.filter(item => item.type === 'noun');
            } else {
                vocab = currentList;
            }
            
            currentIndex = 0;
            updateCard();
        }

        function getArticleHTML(article, showHidden = false) {
            if (!article) return '';
            const cssClass = `art-${article}`;
            if (showHidden) return `<span class="${cssClass} hidden-art">???</span>`;
            return `<span class="${cssClass}">${article}</span>`;
        }

        function updateCard() {
            if (vocab.length === 0) return;

            const item = vocab[currentIndex];
            statsDisplay.innerText = `${currentIndex + 1} / ${vocab.length}`;
            progressFill.style.width = `${((currentIndex + 1) / vocab.length) * 100}%`;
            
            let frontHTML = '';
            let backHTML = '';
            
            let typeLabel = 'Altres';
            if (item.type === 'noun') typeLabel = 'Substantiu';
            if (item.type === 'verb') typeLabel = 'Verb';
            let typeBadge = `<div class="type-badge">${typeLabel}</div>`;

            if (currentMode === 'de-ca') {
                // Front: Alemany (Article + Paraula + PluralBezeichnung)
                if (item.type === 'noun') {
                    let suffix = item.pluralSuffix && item.pluralSuffix !== '-' ? `, ${item.pluralSuffix}` : (item.pluralSuffix === '-' ? ', -' : '');
                    frontHTML = `${typeBadge}<div class="word-main">${getArticleHTML(item.article)} ${item.word}${suffix}</div>`;
                } else {
                    frontHTML = `${typeBadge}<div class="word-main">${item.word}</div>`;
                }

                // Back: Català, Plural complet i Exemples
                backHTML = `<div class="word-main">${item.ca}</div>`;
                if (item.type === 'noun' && item.pluralFull) {
                    backHTML += `<div class="plural-text">Plural: ${item.pluralFull}</div>`;
                }
                if (item.exDe) {
                    backHTML += `<div class="example-box">
                                    <div class="example-de">${item.exDe}</div>
                                    <div class="example-ca">${item.exCa}</div>
                                 </div>`;
                }
            } 
            else if (currentMode === 'ca-de') {
                // Front: Català
                frontHTML = `${typeBadge}<div class="word-main">${item.ca}</div>`;
                
                // Back: Alemany i Exemples
                backHTML = `<div class="word-main">${getArticleHTML(item.article)} ${item.word}</div>`;
                if (item.type === 'noun' && item.pluralFull) {
                    backHTML += `<div class="plural-text">Plural: ${item.pluralFull}</div>`;
                }
                if (item.exDe) {
                    backHTML += `<div class="example-box">
                                    <div class="example-de">${item.exDe}</div>
                                    <div class="example-ca">${item.exCa}</div>
                                 </div>`;
                }
            }
            else if (currentMode === 'art-pl') {
                // Front: Alemany (sense article ni plural) + significat en català petit
                frontHTML = `${typeBadge}
                             <div class="word-main">${getArticleHTML(item.article, true)} ${item.word}</div>
                             <div class="plural-text">Plural: ???</div>
                             <div class="word-secondary">${item.ca}</div>`;
                
                // Back: Revelar la solució completa
                backHTML = `<div class="word-main">${getArticleHTML(item.article)} ${item.word}</div>
                            <div class="plural-text">Plural: ${item.pluralFull}</div>`;
            }

            // Girem la targeta a la posició inicial (cara frontal)
            card.classList.remove('is-flipped');
            isFlipped = false;
            
            // Retardem el canvi de text per no veure com canvia de cop mentre es gira
            setTimeout(() => {
                cardFront.innerHTML = frontHTML;
                cardBack.innerHTML = backHTML;
            }, 180); 
        }

        // --- GESTIÓ D'ESDEVENIMENTS ---
        
        card.addEventListener('click', () => {
            isFlipped = !isFlipped;
            card.classList.toggle('is-flipped', isFlipped);
        });

        document.getElementById('prevBtn').addEventListener('click', () => {
            if (currentIndex > 0) currentIndex--;
            else currentIndex = vocab.length - 1;
            updateCard();
        });

        document.getElementById('nextBtn').addEventListener('click', () => {
            if (currentIndex < vocab.length - 1) currentIndex++;
            else currentIndex = 0;
            updateCard();
        });

        document.getElementById('shuffleBtn').addEventListener('click', () => {
            for (let i = vocab.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [vocab[i], vocab[j]] = [vocab[j], vocab[i]];
            }
            currentIndex = 0;
            updateCard();
        });

        modeSelect.addEventListener('change', () => {
            applyModeFilter();
        });

        // --- SUPORT SWIPE PER A IPHONE ---
        let touchstartX = 0;
        let touchendX = 0;
        const SWIPE_THRESHOLD = 50; // Píxels mínims per considerar-ho un lliscament

        document.getElementById('cardContainer').addEventListener('touchstart', e => {
            touchstartX = e.changedTouches[0].screenX;
        }, {passive: true});

        document.getElementById('cardContainer').addEventListener('touchend', e => {
            touchendX = e.changedTouches[0].screenX;
            handleSwipe();
        }, {passive: true});

        function handleSwipe() {
            if (touchendX < touchstartX - SWIPE_THRESHOLD) {
                // Lliscar cap a l'esquerra -> Següent
                document.getElementById('nextBtn').click();
            }
            if (touchendX > touchstartX + SWIPE_THRESHOLD) {
                // Lliscar cap a la dreta -> Anterior
                document.getElementById('prevBtn').click();
            }
        }

        // Iniciar
        window.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>

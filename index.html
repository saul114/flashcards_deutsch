<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Alemany A1">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <title>Alemany A1 Flashcards</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Phosphor Icons per estètica nativa iOS -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            iosBg: { light: '#f2f2f7', dark: '#000000' },
            iosCard: { light: '#ffffff', dark: '#1c1c1e' },
            iosBlue: '#007aff',
            iosGreen: '#34c759',
            iosRed: '#ff3b30',
            iosOrange: '#ff9500',
            der: '#0284c7',   // Blau per der
            die: '#db2777',   // Rosa/vermell per die
            das: '#16a34a',   // Verd per das
          }
        }
      }
    }
  </script>

  <style>
    /* Estètica iOS nativa */
    body {
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: pan-y;
    }

    /* Flip 3D de la targeta */
    .perspective-1000 {
      perspective: 1200px;
    }
    .card-inner {
      transform-style: preserve-3d;
      transition: transform 0.45s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .card-inner.is-flipped {
      transform: rotateY(180deg);
    }
    .card-face {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .card-back {
      transform: rotateY(180deg);
    }

    /* Suports safe area iPhone notch & home bar */
    .pt-safe { padding-top: max(env(safe-area-inset-top), 16px); }
    .pb-safe { padding-bottom: max(env(safe-area-inset-bottom), 16px); }
    
    /* Scroll suau sense barra visible per categories */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-[#f2f2f7] dark:bg-black text-[#1c1c1e] dark:text-[#f2f2f7] min-h-screen flex flex-col justify-between overflow-x-hidden">

  <!-- Header iOS amb títol i controls ràpids -->
  <header class="pt-safe px-5 pb-3 sticky top-0 bg-[#f2f2f7]/85 dark:bg-black/85 backdrop-blur-md z-30 flex items-center justify-between border-b border-black/5 dark:border-white/10">
    <div>
      <h1 class="text-xl font-bold tracking-tight">Deutsch A1</h1>
      <p id="deck-progress-text" class="text-xs text-gray-500 dark:text-gray-400 font-medium">Carregant targetes...</p>
    </div>
    <div class="flex items-center gap-2">
      <!-- Botó Canvi de Mode (Flashcards / Test) -->
      <button id="toggle-mode-btn" onclick="toggleQuizMode()" class="px-3 py-1.5 rounded-full text-xs font-semibold bg-white dark:bg-[#1c1c1e] text-iosBlue shadow-sm border border-black/5 dark:border-white/10 active:scale-95 transition-transform flex items-center gap-1.5">
        <i class="ph ph-exam text-base"></i>
        <span id="mode-label">Mode Test</span>
      </button>

      <!-- Botó Tema Fosc/Clar -->
      <button onclick="toggleTheme()" class="w-9 h-9 rounded-full flex items-center justify-center bg-white dark:bg-[#1c1c1e] shadow-sm border border-black/5 dark:border-white/10 active:scale-95 transition-transform text-gray-700 dark:text-gray-200">
        <i id="theme-icon" class="ph ph-moon text-lg"></i>
      </button>
    </div>
  </header>

  <!-- Filtres de Categories Scroll horitzontal -->
  <section class="px-4 py-2">
    <div id="category-pills" class="flex gap-2 overflow-x-auto no-scrollbar py-1 text-xs">
      <!-- Es generen dinàmicament -->
    </div>
  </section>

  <!-- CONTENIDOR PRINCIPAL -->
  <main class="flex-1 flex flex-col justify-center px-4 max-w-md w-full mx-auto relative my-auto">
    
    <!-- VISTA 1: FLASHCARDS INTERACTIVES -->
    <div id="flashcard-view" class="w-full flex flex-col items-center">
      
      <!-- Barra superior de progrés del filtre actual -->
      <div class="w-full mb-3 flex items-center gap-3">
        <div class="flex-1 bg-gray-200 dark:bg-gray-800 h-2 rounded-full overflow-hidden">
          <div id="progress-bar-fill" class="bg-iosBlue h-full w-0 transition-all duration-300"></div>
        </div>
        <span id="card-counter" class="text-xs font-semibold text-gray-400 tabular-nums">0/0</span>
      </div>

      <!-- Zona del targetó interactiu 3D -->
      <div class="w-full perspective-1000 min-h-[380px] h-[55vh] max-h-[440px] relative cursor-pointer" id="swipe-area" onclick="flipCard()">
        <div id="flashcard" class="card-inner w-full h-full relative rounded-3xl shadow-xl transition-transform duration-500">
          
          <!-- ANVERS (Alemany) -->
          <div class="card-face absolute inset-0 bg-white dark:bg-[#1c1c1e] rounded-3xl p-6 flex flex-col justify-between border border-black/5 dark:border-white/10 shadow-sm">
            <!-- Capçalera de la targeta -->
            <div class="flex justify-between items-start">
              <span id="card-category" class="text-[11px] font-semibold tracking-wider uppercase px-2.5 py-1 rounded-full bg-gray-100 dark:bg-gray-800 text-gray-500">Categoria</span>
              
              <div class="flex items-center gap-2">
                <span id="card-status-dot" class="w-2.5 h-2.5 rounded-full bg-gray-300"></span>
                <button onclick="event.stopPropagation(); playGermanAudio();" class="w-10 h-10 rounded-full bg-blue-50 dark:bg-blue-950/40 text-iosBlue flex items-center justify-center active:scale-90 transition-transform">
                  <i class="ph ph-speaker-high text-xl"></i>
                </button>
              </div>
            </div>

            <!-- Contingut Central Alemany -->
            <div class="text-center my-auto px-2">
              <div id="article-badge-container" class="mb-2">
                <!-- der / die / das badge -->
              </div>
              <h2 id="card-term" class="text-3xl font-extrabold tracking-tight mb-2 text-gray-900 dark:text-white">...</h2>
              <p id="card-plural" class="text-base font-medium text-gray-500 dark:text-gray-400 min-h-[1.5rem]"></p>
            </div>

            <!-- Peu Anvers: Toc per girar -->
            <div class="flex items-center justify-center gap-1.5 text-xs text-gray-400 font-medium">
              <i class="ph ph-hand-tap text-sm"></i> Toca per veure la traducció
            </div>
          </div>

          <!-- REVERS (Català) -->
          <div class="card-face card-back absolute inset-0 bg-white dark:bg-[#1c1c1e] rounded-3xl p-6 flex flex-col justify-between border border-black/5 dark:border-white/10 shadow-sm">
            <div class="flex justify-between items-start">
              <span class="text-[11px] font-semibold tracking-wider uppercase px-2.5 py-1 rounded-full bg-emerald-50 dark:bg-emerald-950/50 text-emerald-600 dark:text-emerald-400">Traducció</span>
              <button onclick="event.stopPropagation(); playGermanAudio();" class="w-10 h-10 rounded-full bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-300 flex items-center justify-center active:scale-90 transition-transform">
                <i class="ph ph-speaker-high text-xl"></i>
              </button>
            </div>

            <!-- Significat en Català -->
            <div class="text-center my-auto px-2">
              <h3 id="card-meaning" class="text-2xl font-bold text-gray-900 dark:text-white mb-2">...</h3>
              <p id="card-notes" class="text-sm text-gray-500 dark:text-gray-400 italic"></p>
            </div>

            <!-- Peu Revers -->
            <div class="flex items-center justify-center gap-1.5 text-xs text-gray-400 font-medium">
              <i class="ph ph-arrows-clockwise text-sm"></i> Toca per tornar a l'alemany
            </div>
          </div>

        </div>
      </div>

      <!-- BOTONS DE CONTROL RÀPID (DIFÍCIL / FÀCIL & NAVEGACIÓ) -->
      <div class="w-full grid grid-cols-2 gap-3 mt-6">
        <button onclick="markCurrentCard(false)" class="py-3.5 px-4 rounded-2xl bg-white dark:bg-[#1c1c1e] border border-red-200 dark:border-red-900/40 text-iosRed font-semibold text-sm flex items-center justify-center gap-2 shadow-sm active:scale-95 transition-all">
          <i class="ph-bold ph-x text-base"></i>
          Repassar
        </button>
        <button onclick="markCurrentCard(true)" class="py-3.5 px-4 rounded-2xl bg-iosGreen text-white font-semibold text-sm flex items-center justify-center gap-2 shadow-sm active:scale-95 transition-all">
          <i class="ph-bold ph-check text-base"></i>
          Apresa
        </button>
      </div>

      <!-- Navegació Endavant / Enrere -->
      <div class="flex items-center justify-between w-full mt-4 px-2">
        <button onclick="navigateCard(-1)" class="text-xs font-semibold text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 flex items-center gap-1 py-1">
          <i class="ph-bold ph-caret-left"></i> Anterior
        </button>
        <button onclick="shuffleDeck()" class="text-xs font-semibold text-iosBlue flex items-center gap-1 py-1">
          <i class="ph-bold ph-shuffle"></i> Barrejar
        </button>
        <button onclick="navigateCard(1)" class="text-xs font-semibold text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 flex items-center gap-1 py-1">
          Següent <i class="ph-bold ph-caret-right"></i>
        </button>
      </div>

    </div>

    <!-- VISTA 2: QUIZ / TEST MODE RÀPID -->
    <div id="quiz-view" class="w-full hidden flex-col items-center">
      <div class="w-full bg-white dark:bg-[#1c1c1e] rounded-3xl p-6 border border-black/5 dark:border-white/10 shadow-sm flex flex-col min-h-[360px] justify-between">
        <div class="flex justify-between items-center">
          <span class="text-xs font-semibold text-iosBlue uppercase tracking-wider">Comprova el vocabulari</span>
          <button onclick="playQuizAudio()" class="w-8 h-8 rounded-full bg-blue-50 dark:bg-blue-950/40 text-iosBlue flex items-center justify-center">
            <i class="ph ph-speaker-high"></i>
          </button>
        </div>

        <div class="text-center my-6">
          <h2 id="quiz-question-word" class="text-3xl font-extrabold text-gray-900 dark:text-white mb-1">...</h2>
          <p id="quiz-subtext" class="text-xs text-gray-400">Tria la traducció correcta en català:</p>
        </div>

        <!-- 4 Opcions tipus test -->
        <div id="quiz-options" class="grid grid-cols-1 gap-2.5">
          <!-- Opcions dinàmiques -->
        </div>
      </div>
      
      <button onclick="nextQuizQuestion()" class="mt-4 text-xs font-semibold text-iosBlue flex items-center gap-1">
        Següent pregunta <i class="ph-bold ph-arrow-right"></i>
      </button>
    </div>

  </main>

  <!-- PANELL INFORMATIU DE PERSISTÈNCIA & TOTALS -->
  <footer class="pb-safe px-5 pt-3 text-center text-xs text-gray-400 border-t border-black/5 dark:border-white/10 bg-[#f2f2f7]/85 dark:bg-black/85 backdrop-blur-md">
    <div class="flex justify-around items-center max-w-sm mx-auto mb-1">
      <div>
        <span id="stat-total" class="font-bold text-gray-700 dark:text-gray-200">0</span>
        <span class="block text-[10px]">Total</span>
      </div>
      <div>
        <span id="stat-learned" class="font-bold text-iosGreen">0</span>
        <span class="block text-[10px]">Apreses</span>
      </div>
      <div>
        <span id="stat-review" class="font-bold text-iosRed">0</span>
        <span class="block text-[10px]">Per repassar</span>
      </div>
    </div>
  </footer>

    const VOCABULARY_DATA = RAW_VOCAB.map(item => {
      let term = item.term;
      let plural = "";
      
      // Separar plural si existeix
      if (term.includes(",") && !term.startsWith("der, die") && !term.startsWith("ein, eine")) {
          const parts = term.split(",");
          term = parts[0].trim();
          plural = parts.slice(1).join(",").trim();
      }

      // Assignar categories lògiques
      let cat = "Altres";
      if (item.gender === "der") cat = "der (Masc)";
      else if (item.gender === "die") cat = "die (Fem)";
      else if (item.gender === "das") cat = "das (Neu)";
      else if (term.endsWith("en") && !term.includes(" ")) cat = "Verbs"; 
      else cat = "Altres";

      // Assignar gènere pel color del distintiu
      let gender = item.gender === "none" ? "other" : item.gender;
      if (cat === "Verbs") gender = "verb";

      return {
        id: item.id,
        cat: cat,
        gender: gender,
        term: term,
        plural: plural,
        mean: item.definition,
        notes: ""
      };
    });

    /* GESTIÓ D'ESTAT LOCAL */
    let currentCategory = "Totes";
    let activeDeck = [];
    let currentIndex = 0;
    let isFlipped = false;
    let userProgress = JSON.parse(localStorage.getItem('aleman_a1_progress') || '{}');
    let isQuizActive = false;

    // Inicialització
    window.onload = function() {
      setupCategories();
      filterDeck("Totes");
      setupSwipeGestures();
      updateGlobalStats();
    };

    // Configuració de filtres
    function setupCategories() {
      const categories = ["Totes", "Pendents", "Difícils", "der (Masc)", "die (Fem)", "das (Neu)", "Verbs", "Altres"];
      const container = document.getElementById("category-pills");
      container.innerHTML = "";

      categories.forEach(cat => {
        const btn = document.createElement("button");
        btn.innerText = cat;
        btn.className = `px-3.5 py-1.5 rounded-full whitespace-nowrap font-medium transition-all ${
          cat === currentCategory 
            ? "bg-iosBlue text-white shadow-sm" 
            : "bg-white dark:bg-[#1c1c1e] text-gray-600 dark:text-gray-300 border border-black/5 dark:border-white/10"
        }`;
        btn.onclick = () => filterDeck(cat);
        container.appendChild(btn);
      });
    }

    // Filtrar baralla
    function filterDeck(cat) {
      currentCategory = cat;
      setupCategories();

      if (cat === "Totes") {
        activeDeck = [...VOCABULARY_DATA];
      } else if (cat === "Pendents") {
        activeDeck = VOCABULARY_DATA.filter(item => userProgress[item.id] !== true);
      } else if (cat === "Difícils") {
        activeDeck = VOCABULARY_DATA.filter(item => userProgress[item.id] === false);
      } else {
        activeDeck = VOCABULARY_DATA.filter(item => item.cat === cat);
      }

      if (activeDeck.length === 0) {
        activeDeck = [...VOCABULARY_DATA]; // Fallback si no hi ha targetes en dif/pendents
      }

      currentIndex = 0;
      renderCurrentCard();
      if (isQuizActive) renderQuizQuestion();
    }

    // Mostrar targeta actual
    function renderCurrentCard() {
      if (activeDeck.length === 0) return;
      const item = activeDeck[currentIndex];
      const cardEl = document.getElementById("flashcard");
      
      // Resetejar gir
      isFlipped = false;
      cardEl.classList.remove("is-flipped");

      // Elements de text
      document.getElementById("card-category").innerText = item.cat;
      document.getElementById("card-term").innerText = item.term;
      document.getElementById("card-plural").innerText = item.plural ? `Plural: ${item.plural}` : "";
      document.getElementById("card-meaning").innerText = item.mean;
      document.getElementById("card-notes").innerText = item.notes || "";

      // Distintiu de gènere (der=blau, die=rosa/vermell, das=verd)
      const badgeContainer = document.getElementById("article-badge-container");
      badgeContainer.innerHTML = "";
      if (item.gender === "der") {
        badgeContainer.innerHTML = `<span class="px-2.5 py-0.5 rounded-md text-xs font-bold bg-sky-100 dark:bg-sky-950 text-der">der (Masculí)</span>`;
      } else if (item.gender === "die") {
        badgeContainer.innerHTML = `<span class="px-2.5 py-0.5 rounded-md text-xs font-bold bg-pink-100 dark:bg-pink-950 text-die">die (Femení)</span>`;
      } else if (item.gender === "das") {
        badgeContainer.innerHTML = `<span class="px-2.5 py-0.5 rounded-md text-xs font-bold bg-emerald-100 dark:bg-emerald-950 text-das">das (Neutre)</span>`;
      } else if (item.gender === "verb") {
        badgeContainer.innerHTML = `<span class="px-2.5 py-0.5 rounded-md text-xs font-bold bg-purple-100 dark:bg-purple-950 text-purple-600">Verb</span>`;
      }

      // Estat de progrés visual a la targeta
      const statusDot = document.getElementById("card-status-dot");
      if (userProgress[item.id] === true) {
        statusDot.className = "w-2.5 h-2.5 rounded-full bg-iosGreen";
      } else if (userProgress[item.id] === false) {
        statusDot.className = "w-2.5 h-2.5 rounded-full bg-iosRed";
      } else {
        statusDot.className = "w-2.5 h-2.5 rounded-full bg-gray-300 dark:bg-gray-600";
      }

      // Progrés superior
      const percent = ((currentIndex + 1) / activeDeck.length) * 100;
      document.getElementById("progress-bar-fill").style.width = `${percent}%`;
      document.getElementById("card-counter").innerText = `${currentIndex + 1}/${activeDeck.length}`;
      document.getElementById("deck-progress-text").innerText = `${activeDeck.length} paraules a "${currentCategory}"`;
    }

    // Gir de targeta 3D
    function flipCard() {
      isFlipped = !isFlipped;
      document.getElementById("flashcard").classList.toggle("is-flipped", isFlipped);
    }

    // Navegació de targeta
    function navigateCard(delta) {
      currentIndex += delta;
      if (currentIndex >= activeDeck.length) currentIndex = 0;
      if (currentIndex < 0) currentIndex = activeDeck.length - 1;
      renderCurrentCard();
    }

    // Barrejar targetes
    function shuffleDeck() {
      activeDeck.sort(() => Math.random() - 0.5);
      currentIndex = 0;
      renderCurrentCard();
    }

    // Marcar targeta com Sabuda o Difícil (i avançar automàticament)
    function markCurrentCard(isLearned) {
      const item = activeDeck[currentIndex];
      userProgress[item.id] = isLearned;
      localStorage.setItem('aleman_a1_progress', JSON.stringify(userProgress));
      
      updateGlobalStats();
      navigateCard(1);
    }

    // Actualitzar estadístiques inferiors
    function updateGlobalStats() {
      const total = VOCABULARY_DATA.length;
      let learned = 0;
      let review = 0;

      VOCABULARY_DATA.forEach(item => {
        if (userProgress[item.id] === true) learned++;
        if (userProgress[item.id] === false) review++;
      });

      document.getElementById("stat-total").innerText = total;
      document.getElementById("stat-learned").innerText = learned;
      document.getElementById("stat-review").innerText = review;
    }

    let germanVoice = null;

    function loadGermanVoice() {
      if (!('speechSynthesis' in window)) return;
      const voices = window.speechSynthesis.getVoices();
      if (!voices || voices.length === 0) return;

      const norm = v => v.lang.replace('_', '-').toLowerCase();

      // Preferimos de-DE; si no hay ninguna, aceptamos cualquier variante alemana
      let deVoices = voices.filter(v => norm(v) === 'de-de');
      if (deVoices.length === 0) {
        deVoices = voices.filter(v => norm(v).startsWith('de'));
      }
      if (deVoices.length === 0) return;

      const score = v => {
        const n = v.name.toLowerCase();
        let s = 0;
        if (n.includes('premium')) s += 100;
        else if (n.includes('enhanced') || n.includes('erweitert') || n.includes('mejorada')) s += 50;
        if (/anna|helena|markus|petra|viktor/.test(n)) s += 10;
        if (v.localService) s += 5;
        return s;
      };

      germanVoice = [...deVoices].sort((a, b) => score(b) - score(a))[0];
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = loadGermanVoice;
      loadGermanVoice();
    }

    function playGermanAudio(textToSpeak) {
      if (!('speechSynthesis' in window)) return;

      const item = activeDeck[currentIndex];
      const rawText = textToSpeak || item.term;

      // Limpieza: quita paréntesis de anotaciones y lee solo la primera variante
      const cleanText = rawText
        .replace(/\([^)]*\)/g, '')   // (Pl.), (Sg.), (+ Akk.)...
        .split('/')[0]               // "mein / meine" -> "mein"
        .replace(/\s+/g, ' ')
        .trim();

      if (!cleanText) return;

      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(cleanText);
      utterance.lang = 'de-DE';

      if (!germanVoice) loadGermanVoice();
      if (germanVoice) {
        utterance.voice = germanVoice;
      }

      utterance.rate = 0.88;
      utterance.pitch = 1;
      window.speechSynthesis.speak(utterance);
    }

    // Gestos tàctils de Swipe natius
    function setupSwipeGestures() {
      const area = document.getElementById("swipe-area");
      let startX = 0;
      let startY = 0;

      area.addEventListener("touchstart", (e) => {
        startX = e.changedTouches[0].screenX;
        startY = e.changedTouches[0].screenY;
      }, { passive: true });

      area.addEventListener("touchend", (e) => {
        const diffX = e.changedTouches[0].screenX - startX;
        const diffY = e.changedTouches[0].screenY - startY;

        // Validar que el gest és predominantment horitzontal
        if (Math.abs(diffX) > 45 && Math.abs(diffY) < 60) {
          if (diffX < 0) {
            navigateCard(1); // Swipe esquerra -> següent
          } else {
            navigateCard(-1); // Swipe dreta -> anterior
          }
        }
      }, { passive: true });
    }

    // MODE QUIZ / TEST RÀPID
    function toggleQuizMode() {
      isQuizActive = !isQuizActive;
      const flashcardView = document.getElementById("flashcard-view");
      const quizView = document.getElementById("quiz-view");
      const modeLabel = document.getElementById("mode-label");

      if (isQuizActive) {
        flashcardView.classList.add("hidden");
        quizView.classList.remove("hidden");
        quizView.classList.add("flex");
        modeLabel.innerText = "Mode Fitxes";
        renderQuizQuestion();
      } else {
        quizView.classList.add("hidden");
        quizView.classList.remove("flex");
        flashcardView.classList.remove("hidden");
        modeLabel.innerText = "Mode Test";
        renderCurrentCard();
      }
    }

    function renderQuizQuestion() {
      const current = activeDeck[currentIndex];
      document.getElementById("quiz-question-word").innerText = current.term;
      
      // Obtenir 3 respostes falses aleatòries
      const distractors = VOCABULARY_DATA
        .filter(item => item.id !== current.id)
        .sort(() => 0.5 - Math.random())
        .slice(0, 3)
        .map(item => item.mean);

      const options = [...distractors, current.mean].sort(() => 0.5 - Math.random());
      const container = document.getElementById("quiz-options");
      container.innerHTML = "";

      options.forEach(opt => {
        const btn = document.createElement("button");
        btn.innerText = opt;
        btn.className = "w-full text-left py-3 px-4 rounded-xl border border-black/10 dark:border-white/10 bg-gray-50 dark:bg-gray-800 text-sm font-medium transition-all active:scale-98";
        btn.onclick = () => checkQuizAnswer(btn, opt === current.mean);
        container.appendChild(btn);
      });
    }

    function checkQuizAnswer(button, isCorrect) {
      if (isCorrect) {
        button.classList.remove("bg-gray-50", "dark:bg-gray-800");
        button.classList.add("bg-iosGreen", "text-white", "font-bold");
        markCurrentCard(true);
        setTimeout(() => nextQuizQuestion(), 700);
      } else {
        button.classList.remove("bg-gray-50", "dark:bg-gray-800");
        button.classList.add("bg-iosRed", "text-white", "font-bold");
        markCurrentCard(false);
      }
    }

    function nextQuizQuestion() {
      navigateCard(1);
      renderQuizQuestion();
    }

    function playQuizAudio() {
      playGermanAudio(activeDeck[currentIndex].term);
    }

    // Toggle Tema Clar / Fosc
    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle('dark');
      const icon = document.getElementById('theme-icon');
      if (isDark) {
        icon.className = "ph ph-sun text-lg text-amber-400";
      } else {
        icon.className = "ph ph-moon text-lg text-gray-700";
      }
    }
  </script>
</body>
